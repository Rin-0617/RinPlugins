name: Update pluginmaster

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - plugins.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: update-pluginmaster
  cancel-in-progress: false

jobs:
  update:
    name: Build pluginmaster.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_pluginmaster.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- pluginmaster.json; then
            echo "pluginmaster.json is up to date."
            exit 0
          fi
          # 貢献者を Rin-0617 だけにするため、ボットではなく本人の名義でコミットする。
          git config user.name "Rin"
          git config user.email "167505257+Rin-0617@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Update pluginmaster.json"
          git push
