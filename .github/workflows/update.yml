name: Update pluginmaster

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - plugins.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: update-pluginmaster
  cancel-in-progress: false

jobs:
  update:
    name: Build pluginmaster.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and commit (retry on push race)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 貢献者を Rin-0617 だけにするため、ボットではなく本人の名義でコミットする。
          git config user.name "Rin"
          git config user.email "167505257+Rin-0617@users.noreply.github.com"
          # push が別の実行と競合すると "fetch first" で落ちる。最新 main に同期→生成し直し→push を数回試す。
          # 毎回まっさらな最新 main から生成し直すので、リベース衝突は起きず、常に完全な pluginmaster を push できる。
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            python scripts/build_pluginmaster.py
            if git diff --quiet -- pluginmaster.json; then
              echo "pluginmaster.json is up to date."
              exit 0
            fi
            git add pluginmaster.json
            git commit -m "Update pluginmaster.json"
            if git push; then
              echo "pushed on attempt $i."
              exit 0
            fi
            echo "push rejected (attempt $i); re-syncing with latest main and rebuilding..."
          done
          echo "failed to push pluginmaster.json after 5 attempts." >&2
          exit 1
